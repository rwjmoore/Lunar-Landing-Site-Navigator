[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-landing-site-navigator-backend"
version = "0.1.0"
description = "Terrain-aware Sun/Earth line-of-sight analysis API for lunar south-pole landing sites."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.0",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",  # required by FastAPI's TestClient
]

pipeline = [
    # Offline data pipeline only (scripts/); never installed on the hosted server.
    "spiceypy>=6.0",
    "rasterio>=1.4",    # GeoTIFF terrain reading (P3)
    "pyproj>=3.6",      # map projection <-> lunar lat/lon (P3)
    "matplotlib>=3.8",  # evidence plots for physics reviews
]

[tool.setuptools.packages.find]
include = ["app*", "pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
