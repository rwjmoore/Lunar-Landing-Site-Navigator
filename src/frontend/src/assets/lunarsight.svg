<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 76" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">LunarSight logo concept</title>
  <desc id="desc">Two luminous telescope-style eyeglass lenses, with a lunar crescent in the left lens and a star in the right lens.</desc>
  <defs>
    <linearGradient id="lens" x1="13" y1="15" x2="99" y2="65" gradientUnits="userSpaceOnUse"><stop stop-color="#B9E7FF"/><stop offset="1" stop-color="#60A9FA"/></linearGradient>
    <linearGradient id="moon" x1="23" y1="21" x2="56" y2="62" gradientUnits="userSpaceOnUse"><stop stop-color="#E7F7FF"/><stop offset="1" stop-color="#72BAFF"/></linearGradient>
    <mask id="crescent"><circle cx="35" cy="39" r="15" fill="white"/><circle cx="41" cy="33" r="14.2" fill="black"/></mask>
  </defs>
  <path d="M7 30L14 25M105 30L98 25" stroke="url(#lens)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="35" cy="40" r="24.5" stroke="url(#lens)" stroke-width="5"/>
  <circle cx="77" cy="40" r="24.5" stroke="url(#lens)" stroke-width="5"/>
  <path d="M59 34C55.5 30.5 56.5 30.5 53 34" stroke="url(#lens)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="35" cy="39" r="15" fill="url(#moon)" mask="url(#crescent)"/>
  <path d="M77 26L79.7 36.2L90 39L79.7 41.7L77 52L74.3 41.7L64 39L74.3 36.2L77 26Z" fill="#A0D9FF" opacity=".9"/>
  <circle cx="80" cy="37.5" r="2" fill="#F6FDFF"/>
</svg>
